# Job Hunter 默认配置
# 运行时可通过环境变量 JOB_HUNTER_* 覆盖

app:
  name: "Job Hunter"
  version: "0.1.0"
  data_dir: "~/.job-hunter"

llm:
  provider: deepseek
  default_model: deepseek-chat
  reasoner_model: deepseek-reasoner
  embedding_model: deepseek-embed
  temperature: 0.2
  max_tokens: 4096
  request_timeout: 60

discover:
  top_n_directions: 5
  temperature: 0.4

search:
  top_n_jobs_per_direction: 10
  platforms:
    - boss
    - lagou

matching:
  rule_weight: 0.4
  llm_weight: 0.35
  skill_graph_weight: 0.25
  min_score_threshold: 50

optimize:
  max_skill_inflation: 0.15  # 技能占比膨胀上限 15%
  hard_constraints:
    forbid_fabricated_experience: true
    forbid_fake_skills: true
    forbid_exaggerated_years: true
    forbid_fake_projects: true

qa:
  risk_threshold_reject: high    # high 级别自动回退重优化
  risk_threshold_warn: medium    # medium 级别标记警告

export:
  template: professional
  format: pdf
  output_dir: export
